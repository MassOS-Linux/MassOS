UI vesamenu.c32
PROMPT 0
TIMEOUT 200
ONTIMEOUT massos

MENU TITLE Welcome to the MassOS Live CD
MENU BACKGROUND splash.png

LABEL massos
MENU LABEL Boot MassOS Live CD
KERNEL /vmlinuz
APPEND initrd=/initramfs.img root=live:CDLABEL=MASSOS ro quiet splash rd.live.image

LABEL massos-copytoram
MENU LABEL Boot MassOS Live CD (copy-to-RAM)
KERNEL /vmlinuz
APPEND initrd=/initramfs.img root=live:CDLABEL=MASSOS ro quiet splash rd.live.image rd.live.ram

LABEL massos-nomodeset
MENU LABEL Boot MassOS Live CD (fallback graphics)
KERNEL /vmlinuz
APPEND initrd=/initramfs.img root=live:CDLABEL=MASSOS ro quiet splash rd.live.image nomodeset

LABEL memtest
MENU LABEL Run memory test (Memtest86+)
KERNEL memtest64.bin

LABEL reboot
MENU LABEL Reboot system
COM32 reboot.c32

LABEL poweroff
MENU LABEL Shut down system
COM32 poweroff.c32
